<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
     <h2 class="logo">Admin Panel</h2>
         <nav>
           <a href="index.html">Home</a>
           <a href="dashboard.html">Dashboard</a>
           <a href="#" onclick="logout()">Logout</a>
         </nav>
    </header>

    <section class="dashboard">
        <h1>Add New Signal</h1>

        <input id="pair" placeholder="Pair (e.g. EURUSD)">
<select id="type">
    <option value="BUY">BUY</option>
    <option value="SELL">SELL</option>
</select>
<input id="entry" placeholder="Entry">
<input id="tp" placeholder="Take Profit">
<input id="sl" placeholder="Stop Loss">

<button onclick="addSignal()">Add Signal</button>
        
        <div id="signals-container"></div>
    </section>

    <script src="js/script.js"></script>

    <div id="stats-chart"></div>
</body>
</html>
