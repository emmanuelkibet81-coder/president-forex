<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signals Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2 class="logo">ForexSignalsPro</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Signals</a>
            <a href="#">Logout</a>
        </nav>
    </header>

    <section class="dashboard">
    <h1>Live Forex Signals</h1>

<h2>Profit Calculator</h2>

<div class="calculator">
    <input type="number" id="lot" placeholder="Lot Size (e.g 0.1)">
    <input type="number" id="pips" placeholder="Pips">
    <button onclick="calculateProfit()">Calculate</button>

    <p id="result"></p>
</div>

<h2>Performance</h2>

<div class="stats">
    <p>Total Signals: <span id="total"></span></p>
    <p>Closed Signals: <span id="closed"></span></p>
</div>

    <div id="signals-container"></div>
</section>

<script src="js/script.js"></script>

</body>
</html>
